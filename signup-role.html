<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanguard Social — Registration</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8fbff,#eaf2ff);color:#0f172a}.font-display{font-family:Lexend,Inter,sans-serif}.primary{background:linear-gradient(135deg,#2563eb,#0f172a);color:#fff}input:focus{outline:3px solid #bfdbfe;outline-offset:1px}</style></head><body class="min-h-screen"><main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center p-5"><form class="w-full max-w-xl rounded-[28px] border border-white bg-white/90 p-8 shadow-2xl sm:p-12" onsubmit="event.preventDefault();alert('Connect this registration form to your authentication API.')"><a href="/signup" class="text-sm font-semibold text-blue-600">← Choose account type</a><p class="mt-10 text-xs font-bold uppercase tracking-[.18em] text-slate-500" id="eyebrow">Business account</p><h1 class="mt-2 font-display text-3xl font-bold" id="heading">Create your business workspace</h1><p class="mt-3 text-sm text-slate-600" id="description">Start finding qualified leads and automate your growth workflows.</p><div class="mt-7 grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Full name<input required class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="Your name"></label><label class="text-sm font-semibold">Email<input required type="email" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="you@example.com"></label></div><label class="mt-4 block text-sm font-semibold">Password<input required type="password" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="Create a strong password"></label><button class="primary mt-6 w-full rounded-xl px-4 py-3 font-semibold">Create account</button><p class="mt-6 text-center text-sm text-slate-600">Already have an account? <a id="login" href="/business-login" class="font-semibold text-blue-600">Sign in</a></p></form></main><script>if(location.pathname.includes('signup-creator')){eyebrow.textContent='Creator / Influencer account';heading.textContent='Create your creator workspace';description.textContent='Build your profile, showcase your influence, and discover better partnerships.';login.href='/creator-login'}</script></body></html>
