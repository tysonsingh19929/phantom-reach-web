<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Register your Vanguard Social intelligence workspace. Enterprise access for business growth and creator analytics.">
  <title>Vanguard Social — Create Workspace Account</title>
  <link rel="canonical" href="https://socialbyvanguard.com/signup">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230F172A'/%3E%3Cpath d='M6 6h3.4L12 14.6 14.6 6H18l-5 12h-2L6 6Z' fill='white'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8fbff,#eaf2ff);color:#0f172a}
    .font-display{font-family:Lexend,Inter,sans-serif}
    .primary{background:linear-gradient(135deg,#2563eb,#0f172a);color:#fff}
    .primary:hover{background:linear-gradient(135deg,#3b82f6,#111827)}
    input:focus{outline:3px solid #bfdbfe;outline-offset:1px}
  </style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center p-5">
    <form class="w-full max-w-xl rounded-[28px] border border-white bg-white/90 p-8 shadow-2xl sm:p-12" id="regForm" onsubmit="handleRegister(event)">
      <a href="/signup" class="text-sm font-semibold text-blue-600 hover:underline">← Choose account type</a>
      <p class="mt-8 text-xs font-bold uppercase tracking-[.18em] text-slate-500" id="eyebrow">Business account</p>
      <h1 class="mt-2 font-display text-3xl font-bold text-slate-900" id="heading">Create your business workspace</h1>
      <p class="mt-3 text-sm text-slate-600 leading-relaxed" id="description">Start finding qualified leads and automate your growth workflows.</p>
      
      <!-- Notification / Error Box -->
      <div id="regAlert" class="hidden mt-4 p-3.5 rounded-xl text-xs font-medium"></div>

      <div class="mt-7 grid gap-4 sm:grid-cols-2">
        <label class="text-sm font-semibold text-slate-700">Full name
          <input required id="regName" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500" placeholder="Your name">
        </label>
        <label class="text-sm font-semibold text-slate-700">Email
          <input required id="regEmail" type="email" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500" placeholder="you@example.com">
        </label>
      </div>

      <label class="mt-4 block text-sm font-semibold text-slate-700">Password
        <input required id="regPass" type="password" minlength="6" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500" placeholder="At least 6 characters">
      </label>

      <button type="submit" id="regSubmitBtn" class="primary mt-6 w-full rounded-xl px-4 py-3.5 font-semibold text-sm shadow-md cursor-pointer transition">Create account</button>
      
      <p class="mt-6 text-center text-sm text-slate-600">
        Already have an account? <a id="login" href="/business-login" class="font-semibold text-blue-600 hover:underline">Sign in</a>
      </p>
    </form>
  </main>

  <script>
    const isCreator = location.pathname.includes('signup-creator') || new URLSearchParams(location.search).get('role') === 'creator';
    if (isCreator) {
      document.getElementById('eyebrow').textContent = 'Creator / Influencer account';
      document.getElementById('heading').textContent = 'Create your creator workspace';
      document.getElementById('description').textContent = 'Build your profile, showcase your influence, and discover better brand partnerships.';
      document.getElementById('login').href = '/creator-login';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regSubmitBtn');
      const alertBox = document.getElementById('regAlert');
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value.trim();
      const role = isCreator ? 'creator' : 'business';

      alertBox.className = 'hidden';
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = `
        <span class="inline-flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          Creating your workspace...
        </span>
      `;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Failed to create account. Please check your credentials.');
        }

        localStorage.setItem('vanguard_session', JSON.stringify({
          user_id: data.user.user_id,
          name: data.user.name,
          email: data.user.email,
          role: data.user.role,
          plan: data.user.plan,
          loggedIn: true,
          token: data.token,
          ts: Date.now()
        }));

        alertBox.className = 'mt-4 p-3.5 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block';
        alertBox.innerHTML = '<strong>Account created successfully.</strong> Redirecting to your workspace...';

        setTimeout(() => {
          if (isCreator) {
            window.location.href = '/tools/influencer-score';
          } else {
            window.location.href = '/tools/google-leads';
          }
        }, 500);

      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        alertBox.className = 'mt-4 p-3.5 rounded-xl text-xs font-medium bg-rose-50 text-rose-800 border border-rose-200 block';
        alertBox.innerHTML = `<strong>Registration Failed:</strong> ${err.message}`;
      }
    }
  </script>
</body>
</html>
