<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanguard Social — Sign in</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8fbff,#eaf2ff);color:#0f172a}.font-display{font-family:Lexend,Inter,sans-serif}.primary{background:linear-gradient(135deg,#2563eb,#0f172a);color:#fff}input:focus{outline:3px solid #bfdbfe;outline-offset:1px}</style></head><body class="min-h-screen"><main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center p-5"><section class="grid w-full max-w-4xl overflow-hidden rounded-[28px] border border-white bg-white/85 shadow-2xl md:grid-cols-2"><div class="bg-slate-900 p-8 text-white sm:p-12"><a href="/" class="text-sm font-semibold text-blue-200">← Vanguard Social</a><p class="mt-16 text-xs font-bold uppercase tracking-[.18em] text-blue-300">Secure workspace access</p><h1 id="title" class="mt-3 font-display text-3xl font-bold">Business sign-in</h1><p id="copy" class="mt-4 text-sm leading-relaxed text-slate-300">Manage lead generation, reporting, and AI-powered growth workflows from one professional workspace.</p></div><form class="p-8 sm:p-12" onsubmit="event.preventDefault();alert('Connect this form to your authentication API.')"><p class="text-xs font-bold uppercase tracking-[.18em] text-slate-500">Welcome back</p><h2 class="mt-2 font-display text-2xl font-bold">Sign in to Vanguard</h2><label class="mt-7 block text-sm font-semibold">Email address<input required type="email" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="you@company.com"></label><label class="mt-4 block text-sm font-semibold">Password<input required type="password" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3" placeholder="Your password"></label><div class="mt-3 text-right"><a href="#" class="text-xs font-semibold text-blue-600">Forgot password?</a></div><button class="primary mt-6 w-full rounded-xl px-4 py-3 font-semibold">Sign in</button><p class="mt-6 text-center text-sm text-slate-600">New to Vanguard? <a href="/signup" class="font-semibold text-blue-600">Create an account</a></p></form></section></main><script>const role=new URLSearchParams(location.search).get('role');if(role==='creator'){document.getElementById('title').textContent='Creator sign-in';document.getElementById('copy').textContent='Review your influence, discover partnerships, and turn your audience into measurable opportunities.'}</script></body></html>
