<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Sign in to your Vanguard Social intelligence workspace. Access verified lead pipelines and creator intelligence.">
  <title>Vanguard Social — Secure Sign-in</title>
  <link rel="canonical" href="https://socialbyvanguard.com/business-login">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230F172A'/%3E%3Cpath d='M6 6h3.4L12 14.6 14.6 6H18l-5 12h-2L6 6Z' fill='white'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#f8fbff,#eaf2ff);color:#0f172a}
    .font-display{font-family:Lexend,Inter,sans-serif}
    .primary{background:linear-gradient(135deg,#2563eb,#0f172a);color:#fff}
    .primary:hover{background:linear-gradient(135deg,#3b82f6,#111827)}
    input:focus{outline:3px solid #bfdbfe;outline-offset:1px}
  </style>
</head>
<body class="min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-6xl items-center justify-center p-5">
    <section class="grid w-full max-w-4xl overflow-hidden rounded-[28px] border border-white bg-white/85 shadow-2xl md:grid-cols-2">
      
      <div class="bg-slate-900 p-8 text-white sm:p-12 flex flex-col justify-between">
        <div>
          <a href="/" class="text-sm font-semibold text-blue-200 hover:text-white transition">← Vanguard Social</a>
          <p class="mt-16 text-xs font-bold uppercase tracking-[.18em] text-blue-300">Secure workspace access</p>
          <h1 id="title" class="mt-3 font-display text-3xl font-bold">Business sign-in</h1>
          <p id="copy" class="mt-4 text-sm leading-relaxed text-slate-300">Manage lead generation, reporting, and AI-powered growth workflows from one professional workspace.</p>
        </div>
        <div class="pt-8 border-t border-slate-800 text-xs text-slate-400">
          Vanguard Social Intelligence Platform
        </div>
      </div>

      <form class="p-8 sm:p-12" id="loginForm" onsubmit="handleLogin(event)">
        <p class="text-xs font-bold uppercase tracking-[.18em] text-slate-500">Welcome back</p>
        <h2 class="mt-2 font-display text-2xl font-bold text-slate-900">Sign in to Vanguard</h2>
        
        <!-- Notification Box -->
        <div id="loginAlert" class="hidden mt-4 p-3.5 rounded-xl text-xs font-medium"></div>

        <label class="mt-7 block text-sm font-semibold text-slate-700">Email address
          <input required id="loginEmail" type="email" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500" placeholder="you@company.com">
        </label>
        
        <label class="mt-4 block text-sm font-semibold text-slate-700">Password
          <input required id="loginPass" type="password" class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-blue-500" placeholder="Your password">
        </label>
        
        <div class="mt-3 text-right">
          <a href="#" onclick="alert('Password reset instructions will be sent if the email exists.'); return false;" class="text-xs font-semibold text-blue-600 hover:underline">Forgot password?</a>
        </div>
        
        <button type="submit" id="loginSubmitBtn" class="primary mt-6 w-full rounded-xl px-4 py-3.5 font-semibold text-sm cursor-pointer shadow-md transition">Sign in</button>
        
        <p class="mt-6 text-center text-sm text-slate-600">
          New to Vanguard? <a href="/signup" class="font-semibold text-blue-600 hover:underline">Create an account</a>
        </p>
      </form>

    </section>
  </main>

  <script>
    const isCreator = location.pathname.includes('creator') || new URLSearchParams(location.search).get('role') === 'creator';
    if (isCreator) {
      document.getElementById('title').textContent = 'Creator sign-in';
      document.getElementById('copy').textContent = 'Review your influence, discover partnerships, and turn your audience into measurable opportunities.';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginSubmitBtn');
      const alertBox = document.getElementById('loginAlert');
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();

      alertBox.className = 'hidden';
      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = `
        <span class="inline-flex items-center justify-center gap-2">
          <svg class="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          Authenticating...
        </span>
      `;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid email or password.');
        }

        localStorage.setItem('vanguard_session', JSON.stringify({
          user_id: data.user.user_id,
          name: data.user.name,
          email: data.user.email,
          role: data.user.role,
          plan: data.user.plan,
          loggedIn: true,
          token: data.token,
          ts: Date.now()
        }));

        alertBox.className = 'mt-4 p-3.5 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200 block';
        alertBox.innerHTML = '<strong>Authenticated successfully.</strong> Redirecting...';

        setTimeout(() => {
          if (data.user.role === 'creator') {
            window.location.href = '/tools/influencer-score';
          } else {
            window.location.href = '/tools/google-leads';
          }
        }, 500);

      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = originalText;
        alertBox.className = 'mt-4 p-3.5 rounded-xl text-xs font-medium bg-rose-50 text-rose-800 border border-rose-200 block';
        alertBox.innerHTML = `<strong>Sign-in Failed:</strong> ${err.message}`;
      }
    }
  </script>
</body>
</html>
